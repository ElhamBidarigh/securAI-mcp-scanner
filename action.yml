name: "SecurAI MCP Scanner"
description: "Scan MCP server configs for command injection, tool poisoning and rug pulls, and send the results to GitHub Code Scanning."
author: "Ellie Bidarigh"
branding:
  icon: shield
  color: blue

inputs:
  config-path:
    description: "Path to the MCP config JSON file in your repository (for example .mcp.json)"
    required: true
  fail-on:
    description: "Fail the job if any finding is at or above this severity: critical, high, medium, low, info, or none"
    required: false
    default: "high"
  baseline-dir:
    description: "Directory with pinned baselines for rug pull detection. Leave empty to skip the drift check."
    required: false
    default: ""
  sarif-out:
    description: "Where to write the SARIF file"
    required: false
    default: "mcp-scanner.sarif"
  upload-sarif:
    description: "Upload the SARIF file to GitHub Code Scanning. The calling job needs the permission security-events: write."
    required: false
    default: "true"
  python-version:
    description: "Python version used to run the scanner"
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install the scanner
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH"

    - name: Scan MCP config
      id: scan
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
        FAIL_ON: ${{ inputs.fail-on }}
        BASELINE_DIR: ${{ inputs.baseline-dir }}
        SARIF_OUT: ${{ inputs.sarif-out }}
      run: |
        report="$RUNNER_TEMP/mcp-scanner-report.md"
        args=(scan "$CONFIG_PATH" --sarif-out "$SARIF_OUT" --out "$report" --quiet)
        if [ -n "$FAIL_ON" ] && [ "$FAIL_ON" != "none" ]; then args+=(--fail-on "$FAIL_ON"); fi
        if [ -n "$BASELINE_DIR" ]; then args+=(--baseline-dir "$BASELINE_DIR"); else args+=(--no-drift-check); fi
        set +e
        python -m mcp_trust_scanner.cli "${args[@]}"
        code=$?
        set -e
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
        exit 0

    - name: Upload SARIF to Code Scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && hashFiles(inputs.sarif-out) != '' && (steps.scan.outputs.exit_code == '0' || steps.scan.outputs.exit_code == '1') }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif-out }}
        category: securai-mcp-scanner

    - name: Enforce the result
      if: ${{ always() }}
      shell: bash
      env:
        EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
      run: |
        code="${EXIT_CODE:-2}"
        if [ "$code" = "0" ]; then
          echo "MCP scan passed."
        elif [ "$code" = "1" ]; then
          echo "::error::MCP scan found issues at or above the fail-on severity. See the job summary and the Security tab."
          exit 1
        else
          echo "::error::MCP scan could not complete (exit code $code)."
          exit 1
        fi
